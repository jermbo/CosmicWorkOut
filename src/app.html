<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta
			name="theme-color"
			content="#101010"
		/>
		<meta
			name="mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<meta
			name="apple-mobile-web-app-title"
			content="Cosmic"
		/>
		<link
			rel="manifest"
			href="/manifest.webmanifest"
		/>
		<link
			rel="icon"
			href="/favicon.png"
			sizes="48x48"
		/>
		<link
			rel="icon"
			href="/icon.svg"
			type="image/svg+xml"
		/>
		<link
			rel="apple-touch-icon"
			href="/apple-touch-icon.png"
		/>
		<script>
			// Set the theme before first paint so a light-mode user never sees a dark flash.
			// prefsStore.applyTheme() takes over once the app boots.
			(function () {
				var theme = 'dark';
				try {
					var prefs = JSON.parse(localStorage.getItem('cwout:prefs') || '{}');
					theme = prefs.theme || 'dark';
				} catch (e) {}
				if (theme === 'system') {
					theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				}
				if (theme !== 'light') theme = 'dark';
				document.documentElement.dataset.theme = theme;
				if (theme === 'light') {
					document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f1f1ee');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
