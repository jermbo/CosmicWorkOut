<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Workout Table</title>
    <style>
      table {
        font-family: "Open Sans", sans-serif;
        width: 750px;
        border-collapse: collapse;
        border: 3px solid #44475c;
        margin: 10px 10px 0 10px;
      }

      table th {
        text-transform: uppercase;
        text-align: left;
        background: #44475c;
        color: #fff;
        padding: 8px;
        min-width: 30px;
      }

      table td {
        text-align: left;
        padding: 8px;
        border-right: 2px solid #7d82a8;
      }
      table td:last-child {
        border-right: none;
      }
      table tbody tr:nth-child(2n) td {
        background: #d4d8f9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Work out</h1>
      <div class="app">
        <!-- <Workout
          :title="'Warm up'"
          :workouts="warmup"
          :columns="columns"/> -->

        <!-- <Workout
          :title="'Work Out'"
          :workouts="workout"
          :columns="columns"/> -->

        <Workout
          :title="'Cardio'"
          :workouts="cardio"
          :columns="columns"/>

      </div>
    </div>
    <template id="workoutTemplate">
      <article class="workout">
        <h1>{{ title }}</h1>
        <table>
          <thead>
            <tr>
              <th v-for="(col, index) in columns" :key="index">
                {{col}}
              </th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(row, index) in workouts" :key="index">
              <td v-for="(col, i) in columns" :key="i">{{row[col]}}</td>
            </tr>
          </tbody>
        </table>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.5.21/dist/vue.js"></script>
    <script src="scripts/workouts/starter-workouts.js"></script>
    <script src="scripts/main.js"></script>
  </body>
</html>
