<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — Mascot range</title>
<style>
	:root {
		--ink: #0a0a0a; --paper: #f2f0ea; --grid: #171717; --border: #3a3936; --muted: #8e8c86;
		--train: oklch(0.76 0.13 235); --habit: oklch(0.76 0.13 30); --base: oklch(0.76 0.13 300);
		--health: oklch(0.86 0.14 95); --active: oklch(0.76 0.13 160);
		--empty: repeating-linear-gradient(135deg, #2a2a2a 0 3px, var(--ink) 3px 11px);
	}
	* { box-sizing: border-box; margin: 0; }
	body { background: var(--ink); color: var(--paper); font-family: 'JetBrains Mono', ui-monospace, monospace; min-height: 100vh;
		background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
		background-size: 24px 24px; padding-bottom: 90px; }
	.question { padding: 8px 16px; font-size: 12px; color: #ff4fd8; border-bottom: 2px dashed #ff4fd8; background: #1a0016; }
	.top { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; padding: 16px; }
	.col { width: 100%; max-width: 420px; }
	h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; margin: 18px 16px 8px; letter-spacing: 0.06em; }
	h3 b { color: var(--paper); }

	/* mock Overview */
	.phone { border: 3px solid var(--border); }
	.ov-head { padding: 16px; border-bottom: 3px solid var(--paper); position: relative; }
	.eyebrow { font-size: 11px; color: var(--muted); }
	.title-row { display: flex; align-items: flex-end; gap: 10px; margin-top: 4px; }
	.title { font-family: 'Unbounded', system-ui, sans-serif; font-weight: 900; font-size: 30px; line-height: 1; }
	.badges { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
	.badge { border: 0; color: var(--ink); font: 700 11px/1 ui-monospace, monospace; padding: 6px 7px; cursor: pointer; box-shadow: 3px 3px 0 var(--paper); }
	.badge:active { transform: translate(3px, 3px); box-shadow: none; }
	.badge--empty { background: var(--empty); color: var(--muted); border: 2px dashed var(--border); box-shadow: none; padding: 4px 5px; }
	.hint { font-size: 10px; color: var(--muted); margin-top: 8px; }

	.sprite { position: absolute; image-rendering: pixelated; pointer-events: none; }
	.sprite svg { display: block; width: 100%; height: 100%; }
	#headStar { position: relative; width: 66px; height: 60px; flex: none; }
	#headStar .sprite { left: -9px; bottom: 0; }

	.say { position: absolute; z-index: 5; background: var(--paper); color: var(--ink); font-size: 12px; font-weight: 700; padding: 7px 9px;
		box-shadow: 3px 3px 0 var(--health); white-space: nowrap; display: none; }
	.say::after { content: ''; position: absolute; left: 14px; bottom: -6px; width: 6px; height: 6px; background: var(--paper); }
	.say.show { display: block; }

	/* gallery */
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 0 16px; }
	.cell { border: 2px solid var(--border); background: var(--ink); cursor: pointer; position: relative; }
	.cell:hover { border-color: var(--paper); }
	.cell .stage { height: 140px; position: relative; overflow: hidden; border-bottom: 2px solid var(--border);
		background-image: linear-gradient(#1a1a1a 1px, transparent 1px), linear-gradient(90deg, #1a1a1a 1px, transparent 1px); background-size: 12px 12px; }
	.cell .floor { position: absolute; left: 0; right: 0; bottom: 18px; border-top: 2px solid var(--border); }
	.cell .name { padding: 6px 8px 2px; font-size: 12px; font-weight: 700; }
	.cell .when { padding: 0 8px 8px; font-size: 10px; color: var(--muted); }
	.cell .tag { position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: 700; padding: 2px 4px; z-index: 2; }
	.tag--p1 { background: var(--paper); color: var(--ink); }
	.tag--p2 { background: var(--base); color: var(--ink); }
	.lv { position: absolute; top: 8px; right: 8px; font: 900 13px/1 'Unbounded', system-ui, sans-serif; color: var(--health); z-index: 2; }

	.pbar { position: fixed; left: 0; right: 0; bottom: 0; background: #1a0016; border-top: 3px dashed #ff4fd8; padding: 8px 10px;
		display: grid; gap: 4px; z-index: 50; color: #ffb3f0; font-size: 12px; }
	.prow { display: flex; gap: 6px; align-items: center; }
	.prow button { flex: 1; min-height: 38px; background: #ff4fd8; color: #1a0016; border: 0; font: inherit; font-weight: 700; cursor: pointer; }
	.prow button.on { background: #fff; }
	.prow .k { color: #ff8ae6; width: 54px; }
	#state { color: #ff8ae6; font-size: 11px; text-align: center; }
</style>
</head>
<body>
	<div class="question">PROTOTYPE · The whole range: every action the star could have, side by side. Tap a card to play it in the header.</div>

	<div class="top">
		<div class="col">
			<div class="phone">
				<div class="ov-head" id="ovHead">
					<div class="eyebrow">MON · NOV 16</div>
					<div class="title-row"><span class="title">OVERVIEW</span><div id="headStar"></div></div>
					<div class="badges">
						<button class="badge" style="background:var(--train)" data-act="workout" data-say="Workout: 4 weeks. One session makes 5.">T 4W</button>
						<button class="badge" style="background:var(--habit)" data-act="habits" data-say="Habits: 12 days! Log one today for 13.">H 12D</button>
						<button class="badge" style="background:var(--health)" data-act="health" data-say="Health: 3 weeks. Weigh in once this week.">P 3W</button>
						<button class="badge" style="background:var(--base)" data-act="baselines" data-say="Baselines: 6 days. Keep the floor today.">B 6D</button>
						<button class="badge badge--empty" data-act="shrug" data-say="Activity: 0. Log one this week to start.">A 0</button>
					</div>
					<div class="hint">Tap a badge: the star says its line and does that streak's move.</div>
					<div class="say" id="say"></div>
				</div>
			</div>
		</div>
	</div>

	<div id="gallery"></div>

	<div class="pbar">
		<div class="prow"><span class="k">SPEED</span>
			<button data-speed="0.5">0.5×</button><button data-speed="1" class="on">1×</button><button data-speed="1.5">1.5×</button>
		</div>
		<div id="state">All cards loop. Tap one to play it on the header star.</div>
	</div>

<script>
const $ = (id) => document.getElementById(id);

// ===================== bodies: 16×15 pixel maps, each pose drawn =====================
const B = {
	stand: ['.......XX.......', '.......XX.......', '......XXXX......', '......XXXX......', 'XXXXXXXXXXXXXXXX', '.XXXXXXXXXXXXXX.', '..XXXXXXXXXXXX..', '...XXXXXXXXXX...', '...XXXXXXXXXX...', '..XXXXXXXXXXXX..', '..XXXXX..XXXXX..', '.XXXXX....XXXXX.', '.XXXX......XXXX.', 'XXX..........XXX', '................'],
	breathe: ['................', '.......XX.......', '.......XX.......', '......XXXX......', '.XXXXXXXXXXXXXX.', 'XXXXXXXXXXXXXXXX', '..XXXXXXXXXXXX..', '...XXXXXXXXXX...', '...XXXXXXXXXX...', '..XXXXXXXXXXXX..', '..XXXXX..XXXXX..', '.XXXXX....XXXXX.', '.XXXX......XXXX.', 'XXX..........XXX', '................'],
	crouch: ['................', '................', '.......XX.......', '......XXXX......', 'XXXXXXXXXXXXXXXX', 'XXXXXXXXXXXXXXXX', '.XXXXXXXXXXXXXX.', '..XXXXXXXXXXXX..', '..XXXXXXXXXXXX..', '..XXXXXXXXXXXX..', '.XXXXXXXXXXXXXX.', '.XXXXX....XXXXX.', 'XXXX........XXXX', 'XXX..........XXX', '................'],
	reach: ['.......XX.......', '.......XX.......', '......XXXX......', '.X....XXXX....X.', '.XXXXXXXXXXXXXX.', '..XXXXXXXXXXXX..', '...XXXXXXXXXX...', '...XXXXXXXXXX...', '...XXXXXXXXXX...', '...XXXXXXXXXX...', '...XXXX..XXXX...', '...XXX....XXX...', '...XXX....XXX...', '..XX........XX..', '................'],
	cheer: ['.......XX.......', 'X......XX......X', 'XX....XXXX....XX', '.XX...XXXX...XX.', '..XXXXXXXXXXXX..', '..XXXXXXXXXXXX..', '..XXXXXXXXXXXX..', '...XXXXXXXXXX...', '...XXXXXXXXXX...', '..XXXXXXXXXXXX..', '..XXXXX..XXXXX..', '.XXXXX....XXXXX.', '.XXXX......XXXX.', 'XXX..........XXX', '................'],
	side: ['.......XX.......', '.......XX.......', '......XXXX......', '......XXXX......', '.....XXXXXX.....', '.....XXXXXX.....', '......XXXX......', '......XXXX......', '......XXXX......', '.....XXXXXX.....', '.....XXX.XX.....', '.....XXX.XX.....', '.....XX...X.....', '.....XX...XX....', '................'],
	droop: ['................', '........X.......', '.......XX.......', '......XXXX......', '..XXXXXXXXXXXX..', '.XXXXXXXXXXXXXX.', 'XXXXXXXXXXXXXXXX', 'X..XXXXXXXXXX..X', '...XXXXXXXXXX...', '..XXXXXXXXXXXX..', '..XXXXX..XXXXX..', '.XXXXX....XXXXX.', '.XXXX......XXXX.', 'XXX..........XXX', '................'],
	droop2: ['................', '................', '........X.......', '.......XXX......', '..XXXXXXXXXXXX..', '.XXXXXXXXXXXXXX.', 'XXXXXXXXXXXXXXXX', 'X..XXXXXXXXXX..X', 'X..XXXXXXXXXX..X', '..XXXXXXXXXXXX..', '..XXXXX..XXXXX..', '.XXXXX....XXXXX.', '.XXXX......XXXX.', 'XXX..........XXX', '................']
};
const RIGHT_HIGH = ['X.......', 'X......X', 'XX....XX', 'XX...XX.', 'XXXXXX..', 'XXXXXX..'];
const RIGHT_MID = ['X.......', 'X.......', 'XX......', 'XX....XX', 'XXXXXXX.', 'XXXXXX..'];
const mirror = (half) => half.map((r) => [...r].reverse().join(''));
const withArms = (left, right) => B.stand.map((r, y) => (y < 6 ? (left ? left[y] : r.slice(0, 8)) + (right ? right[y] : r.slice(8)) : r));
B.waveHigh = withArms(null, RIGHT_HIGH);
B.waveMid = withArms(null, RIGHT_MID);
B.shrug = withArms(mirror(RIGHT_MID), RIGHT_MID);
const lean = (rows, d) => rows.map((r, y) => (y > 8 ? r : d > 0 ? '.' + r.slice(0, -1) : r.slice(1) + '.'));
B.cheerL = lean(B.cheer, -1);
B.cheerR = lean(B.cheer, 1);
// running: the top leans forward, the legs are drawn in two strides
const legs = (rows, l) => rows.map((r, y) => (y >= 10 && y <= 13 ? l[y - 10] : r));
B.runA = legs(lean(B.stand, 1), ['...XXXXXXXXXX...', '..XXXX...XXXX...', '.XXX.....XXX....', 'XX.......XX.....']);
B.runB = legs(lean(B.stand, 1), ['...XXXXXXXXXX...', '...XXXX...XXXX..', '....XXX.....XXX.', '.....XX.......XX']);

// ===================== faces =====================
const F = {
	open: [[5, 5, 'W'], [6, 5, 'E'], [5, 6, 'E'], [6, 6, 'E'], [9, 5, 'W'], [10, 5, 'E'], [9, 6, 'E'], [10, 6, 'E'], [7, 8, 'E'], [8, 8, 'E']],
	lookL: [[4, 5, 'W'], [5, 5, 'E'], [4, 6, 'E'], [5, 6, 'E'], [8, 5, 'W'], [9, 5, 'E'], [8, 6, 'E'], [9, 6, 'E'], [6, 8, 'E'], [7, 8, 'E']],
	lookR: [[6, 5, 'E'], [7, 5, 'W'], [6, 6, 'E'], [7, 6, 'E'], [10, 5, 'E'], [11, 5, 'W'], [10, 6, 'E'], [11, 6, 'E'], [8, 8, 'E'], [9, 8, 'E']],
	blink: [[5, 6, 'E'], [6, 6, 'E'], [9, 6, 'E'], [10, 6, 'E'], [7, 8, 'E'], [8, 8, 'E']],
	happy: [[4, 6, 'E'], [5, 5, 'E'], [6, 6, 'E'], [9, 6, 'E'], [10, 5, 'E'], [11, 6, 'E'], [6, 8, 'E'], [7, 9, 'E'], [8, 9, 'E'], [9, 8, 'E'], [3, 7, 'C'], [12, 7, 'C']],
	oh: [[5, 5, 'W'], [6, 5, 'E'], [5, 6, 'E'], [6, 6, 'E'], [9, 5, 'W'], [10, 5, 'E'], [9, 6, 'E'], [10, 6, 'E'], [7, 8, 'E'], [8, 8, 'E'], [7, 9, 'E'], [8, 9, 'E']],
	squint: [[4, 5, 'E'], [5, 6, 'E'], [6, 6, 'E'], [9, 6, 'E'], [10, 6, 'E'], [11, 5, 'E'], [7, 8, 'E'], [8, 8, 'E'], [3, 7, 'C'], [12, 7, 'C']],
	meh: [[4, 5, 'W'], [5, 5, 'E'], [4, 6, 'E'], [5, 6, 'E'], [8, 5, 'W'], [9, 5, 'E'], [8, 6, 'E'], [9, 6, 'E'], [6, 8, 'E'], [7, 8, 'E'], [8, 8, 'E'], [9, 8, 'E']],
	sad: [[5, 4, 'E'], [10, 4, 'E'], [5, 6, 'E'], [6, 6, 'E'], [9, 6, 'E'], [10, 6, 'E'], [6, 9, 'E'], [7, 8, 'E'], [8, 8, 'E'], [9, 9, 'E']],
	squeeze: [[4, 5, 'E'], [5, 6, 'E'], [4, 7, 'E'], [11, 5, 'E'], [10, 6, 'E'], [11, 7, 'E'], [7, 8, 'E'], [8, 8, 'E'], [7, 9, 'E'], [8, 9, 'E'], [3, 8, 'C'], [12, 8, 'C']],
	sleep: [[5, 6, 'E'], [6, 6, 'E'], [9, 6, 'E'], [10, 6, 'E'], [7, 9, 'E']],
	focus: [[5, 5, 'E'], [6, 5, 'E'], [5, 6, 'E'], [6, 6, 'E'], [9, 5, 'E'], [10, 5, 'E'], [9, 6, 'E'], [10, 6, 'E'], [7, 8, 'E'], [8, 8, 'E'], [9, 8, 'E']],
	none: []
};
const FACE_AT = { stand: [0, 0], breathe: [0, 1], crouch: [0, 2], reach: [0, 0], cheer: [0, 0], waveHigh: [0, 0], waveMid: [0, 0], shrug: [0, 0], cheerL: [-1, 0], cheerR: [1, 0], side: [0, 0], droop: [0, 1], droop2: [0, 2], runA: [1, 0], runB: [1, 0] };

// ===================== props: small drawn things =====================
const shape = (rows, ox, oy, c) => rows.flatMap((r, y) => [...r].flatMap((ch, x) => (ch === 'X' ? [[ox + x, oy + y, c]] : ch === 'W' ? [[ox + x, oy + y, 'W']] : [])));
const P = {
	dumbbell: (cx, cy) => [[cx - 2, cy - 1, 'D'], [cx - 2, cy, 'D'], [cx - 2, cy + 1, 'D'], [cx - 1, cy, 'G'], [cx, cy, 'G'], [cx + 1, cy, 'G'], [cx + 2, cy - 1, 'D'], [cx + 2, cy, 'D'], [cx + 2, cy + 1, 'D']],
	heartS: (x, y) => shape(['X.X', 'XXX', '.X.'], x, y, 'R'),
	heartL: (x, y) => shape(['.X.X.', 'XXXXX', 'XXXXX', '.XXX.', '..X..'], x, y, 'R'),
	check: (x, y) => shape(['....X', '...X.', 'X.X..', '.X...'], x, y, 'A'),
	z: (x, y) => shape(['XXXX', '..X.', '.X..', 'XXXX'], x, y, 'Z'),
	drop: (x, y) => [[x, y, 'B'], [x, y + 1, 'B']],
	tear: (x, y) => [[x, y, 'B']],
	ring: (r) => { const out = []; for (let a = 0; a < 16; a++) { const t = (a / 16) * Math.PI * 2; out.push([Math.round(7.5 + Math.cos(t) * r), Math.round(7 + Math.sin(t) * r), 'H']); } return out; }
};

const PAL = { X: 'oklch(0.86 0.14 95)', H: '#fff8d0', S: 'oklch(0.72 0.15 75)', E: '#0a0a0a', W: '#ffffff', C: 'oklch(0.76 0.13 30)', K: 'oklch(0.62 0.13 70)',
	G: '#bdbab2', D: '#6e6c66', R: 'oklch(0.7 0.19 28)', A: 'oklch(0.76 0.13 30)', Z: '#f2f0ea', B: 'oklch(0.76 0.13 235)', L: '#fffdf0' };
const VB = { x: -3, y: -6, w: 22, h: 21 };

function draw(fr) {
	const rows = B[fr.b], h = rows.length, w = 16;
	const at = (x, y) => y >= 0 && y < h && x >= 0 && x < w && rows[y][x] === 'X';
	let s = '';
	const px = (x, y, c) => (s += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]}"/>`);
	for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
		if (!at(x, y)) continue;
		let c = 'X';
		if (!at(x, y - 1) || !at(x - 1, y)) c = 'H';
		if (!at(x, y + 1) || !at(x + 1, y)) c = 'S';
		if (fr.back) c = c === 'H' ? 'X' : 'K';
		if (fr.glow) c = c === 'S' ? 'H' : 'L';
		px(x, y, c);
	}
	if (!fr.back) {
		const [dx, dy] = FACE_AT[fr.b] || [0, 0];
		for (const [x, y, c] of F[fr.f || 'open']) px(x + dx, y + dy, c);
	}
	for (const [x, y, c] of fr.p || []) px(x, y, c);
	return `<svg viewBox="${VB.x} ${VB.y} ${VB.w} ${VB.h}" shape-rendering="crispEdges">${s}</svg>`;
}

class Sprite {
	constructor(parent, scale) {
		this.scale = scale;
		this.el = document.createElement('div');
		this.el.className = 'sprite';
		this.el.style.width = VB.w * scale + 'px';
		this.el.style.height = VB.h * scale + 'px';
		parent.appendChild(this.el);
		this.set({ b: 'stand', f: 'open' });
	}
	set(fr) {
		this.el.innerHTML = draw(fr);
		this.el.style.transform = `translate(${(fr.x || 0) * this.scale}px, ${(fr.y || 0) * this.scale}px)`;
	}
}

// ===================== every action =====================
const rep = (n, frames) => Array.from({ length: n }, () => frames).flat();
const ACT = {
	idle: [
		{ b: 'stand', t: 700 }, { b: 'breathe', t: 700 }, { b: 'stand', t: 500 }, { b: 'stand', f: 'blink', t: 110 },
		{ b: 'stand', t: 600 }, { b: 'breathe', f: 'lookL', t: 700 }, { b: 'stand', f: 'lookL', t: 500 }, { b: 'breathe', t: 700 },
		{ b: 'stand', f: 'lookR', t: 700 }, { b: 'breathe', f: 'lookR', t: 500 }, { b: 'stand', t: 400 }
	],
	wave: [
		{ b: 'stand', t: 120 }, { b: 'stand', f: 'oh', t: 140 },
		...rep(3, [{ b: 'waveMid', f: 'happy', t: 120 }, { b: 'waveHigh', f: 'happy', t: 150 }]),
		{ b: 'stand', f: 'happy', t: 500 }
	],
	talk: [
		...rep(5, [{ b: 'stand', f: 'oh', t: 110 }, { b: 'stand', t: 90 }]),
		{ b: 'stand', f: 'oh', t: 110 }, { b: 'stand', f: 'happy', t: 400 }
	],
	hop: [
		{ b: 'crouch', f: 'squint', t: 90 }, { b: 'reach', f: 'happy', y: -3, t: 70 }, { b: 'reach', f: 'happy', y: -5, t: 90 },
		{ b: 'stand', f: 'happy', y: -4, t: 80 }, { b: 'stand', f: 'happy', y: -2, t: 70 }, { b: 'crouch', f: 'happy', t: 90 },
		{ b: 'stand', f: 'happy', t: 600 }
	],
	dance: [
		{ b: 'stand', f: 'oh', t: 160 }, { b: 'crouch', f: 'squint', t: 140 },
		{ b: 'reach', f: 'happy', y: -4, t: 70 }, { b: 'cheer', f: 'happy', y: -7, t: 90, spark: 1 }, { b: 'cheer', f: 'happy', y: -8, t: 120 },
		{ b: 'cheer', f: 'happy', y: -6, t: 80 }, { b: 'reach', f: 'happy', y: -3, t: 60 }, { b: 'crouch', f: 'happy', t: 100 },
		{ b: 'stand', y: -1, t: 70 }, { b: 'side', f: 'none', y: -2, t: 70 }, { b: 'stand', back: true, y: -3, t: 80 },
		{ b: 'side', f: 'none', y: -2, t: 70 }, { b: 'stand', f: 'happy', y: -1, t: 70 }, { b: 'crouch', f: 'happy', t: 90 },
		...rep(2, [{ b: 'cheerL', f: 'happy', x: -1, t: 150, spark: 1 }, { b: 'cheer', f: 'happy', t: 90 }, { b: 'cheerR', f: 'happy', x: 1, t: 150 }, { b: 'cheer', f: 'happy', t: 90 }]),
		{ b: 'crouch', f: 'squint', t: 90 }, { b: 'reach', f: 'happy', y: -4, t: 80 }, { b: 'cheer', f: 'happy', y: -5, t: 120, spark: 1 },
		{ b: 'reach', f: 'happy', y: -2, t: 70 }, { b: 'crouch', f: 'happy', t: 90 }, { b: 'cheer', f: 'happy', t: 900 }
	],
	workout: [
		...rep(2, [
			{ b: 'stand', f: 'focus', p: P.dumbbell(16, 5), t: 260 }, { b: 'waveMid', f: 'focus', p: P.dumbbell(16, 2), t: 110 },
			{ b: 'waveHigh', f: 'squint', p: P.dumbbell(16, 0), t: 320 }, { b: 'waveMid', f: 'focus', p: P.dumbbell(16, 2), t: 110 }
		]),
		{ b: 'stand', f: 'happy', p: P.dumbbell(16, 5), t: 600 }
	],
	habits: [
		{ b: 'stand', t: 200 }, { b: 'crouch', f: 'squint', t: 100 }, { b: 'reach', f: 'happy', y: -2, p: P.check(6, -4), t: 120 },
		{ b: 'stand', f: 'happy', y: -1, p: P.check(6, -5), t: 120 }, { b: 'stand', f: 'happy', p: P.check(6, -5), t: 700 },
		{ b: 'breathe', f: 'happy', p: P.check(6, -5), t: 400 }, { b: 'stand', f: 'happy', t: 300 }
	],
	health: [
		...rep(3, [{ b: 'stand', f: 'happy', p: P.heartS(6, -5), t: 260 }, { b: 'breathe', f: 'happy', p: P.heartL(5, -6), t: 180 }]),
		{ b: 'stand', f: 'happy', t: 400 }
	],
	activity: [
		...rep(5, [{ b: 'runA', f: 'focus', y: -1, t: 90 }, { b: 'runB', f: 'focus', t: 90, p: P.drop(14, 1) }]),
		{ b: 'stand', f: 'happy', p: P.drop(14, 2), t: 200 }, { b: 'breathe', f: 'happy', t: 300 }, { b: 'stand', f: 'happy', t: 300 }
	],
	baselines: [
		{ b: 'reach', f: 'squint', t: 300 }, { b: 'cheerL', f: 'squint', x: -1, t: 450 }, { b: 'cheer', f: 'focus', t: 140 },
		{ b: 'cheerR', f: 'squint', x: 1, t: 450 }, { b: 'cheer', f: 'focus', t: 140 }, { b: 'reach', f: 'happy', t: 260 }, { b: 'stand', f: 'happy', t: 500 }
	],
	shrug: [
		{ b: 'stand', f: 'lookL', t: 300 }, { b: 'shrug', f: 'meh', t: 120 }, { b: 'shrug', f: 'meh', y: -1, t: 500 },
		{ b: 'shrug', f: 'meh', t: 120 }, { b: 'stand', f: 'meh', t: 400 }, { b: 'stand', t: 300 }
	],
	sad: [
		{ b: 'droop', f: 'sad', t: 900 }, { b: 'droop2', f: 'sad', t: 900, p: P.tear(4, 8) },
		{ b: 'droop', f: 'sad', t: 500, p: P.tear(4, 9) }, { b: 'droop', f: 'sad', t: 400, p: P.tear(4, 11) },
		{ b: 'droop2', f: 'sad', t: 900 }, { b: 'droop', f: 'sad', t: 300 }
	],
	cheerUp: [
		{ b: 'droop', f: 'sad', t: 600 }, { b: 'droop', f: 'blink', t: 120 }, { b: 'stand', f: 'oh', t: 200 },
		{ b: 'crouch', f: 'squint', t: 100 }, { b: 'reach', f: 'happy', y: -3, t: 80 }, { b: 'cheer', f: 'happy', y: -5, t: 140, spark: 1 },
		{ b: 'cheer', f: 'happy', y: -3, t: 80 }, { b: 'crouch', f: 'happy', t: 90 }, { b: 'cheer', f: 'happy', t: 700 }
	],
	sleep: [
		{ b: 'crouch', f: 'sleep', t: 500, p: P.z(12, -1) }, { b: 'crouch', f: 'sleep', t: 500, p: [...P.z(13, -3)] },
		{ b: 'breathe', f: 'sleep', t: 500, y: 1, p: [...P.z(14, -5), ...P.z(12, -1)] }, { b: 'crouch', f: 'sleep', t: 500, p: P.z(13, -3) },
		{ b: 'crouch', f: 'sleep', t: 500, p: P.z(14, -5) }, { b: 'breathe', f: 'sleep', y: 1, t: 500 }
	],
	levelUp: [
		{ b: 'stand', f: 'oh', t: 200 }, { b: 'crouch', f: 'squint', t: 140 },
		...rep(3, [{ b: 'cheer', f: 'happy', y: -3, glow: 1, t: 80 }, { b: 'cheer', f: 'happy', y: -3, t: 80 }]),
		{ b: 'cheer', f: 'happy', y: -3, p: P.ring(9), t: 100, lv: 1, spark: 1 }, { b: 'cheer', f: 'happy', y: -2, p: P.ring(11), t: 100 },
		{ b: 'cheer', f: 'happy', y: -1, t: 100 }, { b: 'crouch', f: 'happy', t: 100 }, { b: 'cheer', f: 'happy', t: 900 }
	],
	poke: [
		{ b: 'crouch', f: 'squeeze', t: 140 }, ...rep(3, [{ b: 'stand', f: 'squeeze', x: -1, t: 60 }, { b: 'stand', f: 'squeeze', x: 1, t: 60 }]),
		{ b: 'stand', f: 'happy', t: 200 }, { b: 'reach', f: 'happy', y: -2, t: 90 }, { b: 'stand', f: 'happy', t: 500 }
	],
	pet: [
		{ b: 'stand', f: 'blink', t: 200 }, { b: 'breathe', f: 'happy', p: P.heartS(13, 1), t: 300 }, { b: 'stand', f: 'happy', p: P.heartS(14, -2), t: 300 },
		{ b: 'breathe', f: 'happy', p: [...P.heartS(15, -5), ...P.heartS(-1, 0)], t: 300 }, { b: 'stand', f: 'happy', p: P.heartS(-2, -3), t: 300 },
		{ b: 'breathe', f: 'happy', t: 300 }
	]
};

const CARDS = [
	['Phase 1', [
		['idle', 'Idle', 'Always: breathes, blinks, looks around'],
		['wave', 'Wave', 'First open of the day'],
		['talk', 'Talk', 'Says a line, such as a badge tap'],
		['hop', 'Happy hop', 'Small moment: a habit reaches its goal'],
		['dance', 'Dance', 'Big moment: a session is done'],
		['shrug', 'Shrug', 'A badge at 0']
	]],
	['Streak moves (one per tracker, on a badge tap)', [
		['workout', 'Workout · lift', 'Workout streak'],
		['habits', 'Habits · check', 'Habits streak'],
		['health', 'Health · heartbeat', 'Health streak'],
		['activity', 'Activity · run', 'Activity streak'],
		['baselines', 'Baselines · stretch', 'Baselines streak']
	]],
	['Phase 2 · the Pet', [
		['sad', 'Sad', '2 days with nothing logged'],
		['cheerUp', 'Cheer up', 'The first log after a sad spell'],
		['sleep', 'Sleep', 'Late at night'],
		['levelUp', 'Level up', 'Enough logging for a new level'],
		['poke', 'Poke', 'You tap the Pet'],
		['pet', 'Pet', 'You hold a finger on it']
	]]
];

let SPEED = 1;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms / SPEED));

// sparkles, drawn frames
const SPARK = [['..X..'], ['.XXX.'], ['XXWXX'], ['.X.X.'], ['..X..']].map((m, i) => [
	['.....', '.....', '..X..', '.....', '.....'], ['.....', '..X..', '.XXX.', '..X..', '.....'], ['..X..', '..X..', 'XXWXX', '..X..', '..X..'],
	['.....', '..X..', '.X.X.', '..X..', '.....'], ['.....', '.....', '..X..', '.....', '.....']][i]);
const COLS = ['oklch(0.86 0.14 95)', 'oklch(0.76 0.13 235)', 'oklch(0.76 0.13 30)', 'oklch(0.76 0.13 300)', 'oklch(0.76 0.13 160)'];
async function sparkle(parent, x, y, scale) {
	const col = COLS[Math.floor(Math.random() * COLS.length)];
	const el = document.createElement('div');
	el.className = 'sprite';
	el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = el.style.height = 5 * scale + 'px';
	parent.appendChild(el);
	for (const m of SPARK) {
		let s = '';
		m.forEach((r, yy) => [...r].forEach((c, xx) => { if (c !== '.') s += `<rect x="${xx}" y="${yy}" width="1.02" height="1.02" fill="${c === 'W' ? '#fff' : col}"/>`; }));
		el.innerHTML = `<svg viewBox="0 0 5 5" shape-rendering="crispEdges">${s}</svg>`;
		await sleep(80);
	}
	el.remove();
}
function burst(parent, w, h, scale) {
	for (let k = 0; k < 3; k++) setTimeout(() => sparkle(parent, Math.round(Math.random() * (w - 20)), Math.round(Math.random() * h * 0.6), scale), k * 80);
}

async function run(sprite, name, stage, onFrame) {
	for (const fr of ACT[name]) {
		sprite.set(fr);
		if (fr.spark && stage) burst(stage, stage.clientWidth, stage.clientHeight, 3);
		if (onFrame) onFrame(fr);
		await sleep(fr.t);
	}
	sprite.set({ b: 'stand' });
}

// ===================== the gallery =====================
const gal = $('gallery');
for (const [title, list] of CARDS) {
	const h = document.createElement('h3');
	h.innerHTML = title.startsWith('Phase') ? `<b>${title}</b>` : title;
	gal.appendChild(h);
	const grid = document.createElement('div');
	grid.className = 'grid';
	gal.appendChild(grid);
	for (const [key, name, when] of list) {
		const cell = document.createElement('div');
		cell.className = 'cell';
		const p2 = title.includes('Phase 2'), streak = title.startsWith('Streak');
		cell.innerHTML = `<div class="stage"><span class="tag ${p2 || streak ? 'tag--p2' : 'tag--p1'}">${p2 ? 'P2' : streak ? 'P2' : 'P1'}</span><div class="floor"></div></div><div class="name">${name}</div><div class="when">${when}</div>`;
		grid.appendChild(cell);
		const stage = cell.querySelector('.stage');
		const sp = new Sprite(stage, 5);
		sp.el.style.left = 'calc(50% - 55px)';
		sp.el.style.bottom = '18px';
		(async () => {
			await new Promise((r) => setTimeout(r, Math.random() * 900));
			while (true) {
				let lv;
				await run(sp, key, stage, (fr) => {
					if (fr.lv && !lv) { lv = document.createElement('div'); lv.className = 'lv'; lv.textContent = 'LV 5'; stage.appendChild(lv); }
				});
				lv?.remove();
				await sleep(key === 'idle' ? 0 : 1100);
			}
		})();
		cell.onclick = () => playHead(key, name);
	}
}

// ===================== the header star =====================
const head = new Sprite($('headStar'), 3);
let headBusy = false;
async function playHead(key, label) {
	if (headBusy) return;
	headBusy = true;
	$('state').textContent = `header: ${label}`;
	const ov = $('ovHead');
	await run(head, key, ov);
	headBusy = false;
}
(async function headIdle() {
	while (true) { if (!headBusy) await run(head, 'idle'); else await new Promise((r) => setTimeout(r, 200)); }
})();

let sayTimer;
async function say(text) {
	const el = $('say'), hs = $('headStar');
	el.style.left = hs.offsetLeft - 6 + 'px';
	el.style.top = hs.offsetTop - 30 + 'px';
	el.classList.add('show'); el.textContent = '';
	clearTimeout(sayTimer);
	for (let i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); await new Promise((r) => setTimeout(r, 18)); }
	sayTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
document.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => { say(b.dataset.say); playHead(b.dataset.act, b.textContent); }));
document.querySelectorAll('[data-speed]').forEach((b) => (b.onclick = () => {
	SPEED = +b.dataset.speed;
	document.querySelectorAll('[data-speed]').forEach((x) => x.classList.toggle('on', x === b));
}));
setTimeout(() => { say('Morning! Habits: day 12'); playHead('wave', 'Wave'); }, 500);
</script>
