<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CosmicWorkout">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f56e"/>
      <stop offset="1" stop-color="#9fe024"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b2f042" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b2f042" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background (safe for maskable + apple-touch-icon) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>

  <!-- tilted orbit -->
  <g transform="rotate(-24 256 256)">
    <ellipse cx="256" cy="256" rx="196" ry="74" fill="none" stroke="#b286fd" stroke-opacity="0.55" stroke-width="7"/>
    <ellipse cx="256" cy="256" rx="196" ry="74" fill="none" stroke="#60c6ff" stroke-opacity="0.18" stroke-width="14"/>
  </g>

  <!-- dumbbell: bar -->
  <rect x="182" y="241" width="148" height="30" rx="15" fill="url(#lime)"/>

  <!-- left weights (planets) -->
  <rect x="150" y="196" width="34" height="120" rx="15" fill="url(#lime)"/>
  <rect x="182" y="214" width="24" height="84" rx="12" fill="#8fcf1f"/>
  <!-- right weights (planets) -->
  <rect x="328" y="196" width="34" height="120" rx="15" fill="url(#lime)"/>
  <rect x="306" y="214" width="24" height="84" rx="12" fill="#8fcf1f"/>

  <!-- star spark -->
  <g transform="translate(372 150)" fill="#ffffff">
    <path d="M0 -18 L4 -4 L18 0 L4 4 L0 18 L-4 4 L-18 0 L-4 -4 Z"/>
  </g>
  <circle cx="148" cy="372" r="5" fill="#60c6ff"/>
  <circle cx="392" cy="356" r="3.5" fill="#b286fd"/>
</svg>
